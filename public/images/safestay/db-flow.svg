<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" role="img" aria-labelledby="title desc">
  <title id="title">SafeStay DB 복제와 모니터링 개념도</title>
  <desc id="desc">서비스 접속을 MaxScale이 중계하고 MariaDB Master가 Slave로 복제합니다. PMM은 두 DB의 지표를 관찰합니다. Master 중지 시 Slave 승격, 재기동 시 복귀를 확인한 테스트 절차를 요약했습니다.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="m0 0 10 5-10 5z" fill="#657f86"/></marker></defs>
  <rect width="640" height="690" fill="#f7f9f7"/>
  <g font-family="Noto Sans KR,Malgun Gothic,sans-serif" text-anchor="middle" fill="#243f49">
    <text x="320" y="48" font-size="24" font-weight="700">DB 복제 · 접속 · 지표 관찰</text>
    <text x="320" y="77" font-size="14" fill="#6c7d7b">구축 기록을 정리한 개념도</text>
    <rect x="220" y="108" width="200" height="52" rx="8" fill="#e9efeb" stroke="#c8d5ce"/><text x="320" y="140" font-size="19">호텔 예약 서비스</text>
    <path d="M320 161v37" stroke="#657f86" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="180" y="202" width="280" height="72" rx="8" fill="#e4edf0" stroke="#b7cbd0"/><text x="320" y="231" font-size="21" font-weight="700">MaxScale</text><text x="320" y="255" font-size="14">접속 중계 · DB 역할 전환</text>
    <path d="M245 274v35H160v36M395 274v35h85v36" fill="none" stroke="#657f86" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="55" y="350" width="210" height="85" rx="8" fill="#deebe3" stroke="#a7c1b3"/><text x="160" y="383" font-size="21" font-weight="700">MariaDB Master</text><text x="160" y="411" font-size="14">주 데이터베이스</text>
    <rect x="375" y="350" width="210" height="85" rx="8" fill="#edf1ed" stroke="#c2cec4"/><text x="480" y="383" font-size="21" font-weight="700">MariaDB Slave</text><text x="480" y="411" font-size="14">복제 데이터베이스</text>
    <path d="M267 390h105" stroke="#657f86" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="374" font-size="14">복제</text>
    <path d="M160 436v47h320v-47M320 483v23" fill="none" stroke="#8a9a94" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <rect x="180" y="510" width="280" height="65" rx="8" fill="#fff" stroke="#c5d1cb"/><text x="320" y="539" font-size="20" font-weight="700">PMM</text><text x="320" y="561" font-size="14">두 DB의 상태·성능 지표 관찰</text>
    <text x="320" y="619" font-size="16" font-weight="700">확인한 테스트 절차</text><text x="320" y="647" font-size="14">Master 중지 → Slave 승격 확인 → 재기동·복귀 확인</text>
    <text x="320" y="674" font-size="12" fill="#788781">복구 시간·데이터 손실량 측정 및 백업 시험은 후속 과제</text>
  </g>
</svg>
